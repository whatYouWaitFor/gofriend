spring:
  application:
    name: gofriend-backend
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3308/yupao
    username: root
    password: root
  session:
    # session超时时间
    timeout: 86400
    # 启用Redis来存储session，默认是none存储在单台服务器的内存
    store-type: redis
  data:
    # 设置Redis
    redis:
      host: localhost
      port: 6379
      database: 0

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    # MyBatis 驼峰命名
    map-underscore-to-camel-case: true
    # 如果项目无日志框架，可以考虑指定为 org.apache.ibatis.logging.stdout.StdOutImpl (请勿在实际生产中使用).
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 配置全局的逻辑删除
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除字段名(isDelete为实体类属性名称)
      logic-delete-value: 1 # 逻辑已删除值。可选，默认值为 1
      logic-not-delete-value: 0 # 逻辑未删除值。可选，默认值为 0

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.greg.gofriend.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
    home-custom-path: /doc.html
  # 是否是生产环境，如果设置为true。部署到生产环境，knife4j将不会显示swagger-ui.html
  production: false